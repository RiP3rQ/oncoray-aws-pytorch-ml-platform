[project]
name = "model-service"
version = "0.1.0"
description = "Internal FastAPI model inference service."
requires-python = ">=3.11"
dependencies = [
    "fastapi[all]>=0.135.3",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.20",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11",
    "mypy>=1.15",
]


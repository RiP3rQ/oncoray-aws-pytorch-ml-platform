[project]
name = "fastapi-core-api"
version = "0.1.0"
description = "FastAPI service for the monorepo."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asgiref>=3.11.1",
    "asyncpg>=0.31.0",
    "boto3>=1.42.84",
    "celery>=5.6.3",
    "fastapi-mail>=1.6.2",
    "fastapi[all]>=0.135.3",
    "httpx>=0.28.1",
    "jwt>=1.4.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2>=2.9.11",
    "pyjwt>=2.12.1",
    "redis>=7.4.0",
    "scalar-fastapi>=1.8.1",
    "sqlmodel>=0.0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*", "src/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
]

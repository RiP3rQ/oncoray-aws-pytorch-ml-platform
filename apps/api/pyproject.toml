    "fastapi-mail>=1.6.2",
    "fastapi[all]>=0.135.3",
    "jwt>=1.4.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2>=2.9.11",
    "pyjwt>=2.12.1",
    "redis>=7.4.0",
    "scalar-fastapi>=1.8.1",
    "sqlmodel>=0.0.38",
]

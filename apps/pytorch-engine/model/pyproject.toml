[project]
name = "first-model"
version = "0.1.0"
description = "Our first PyTorch model inside the monorepo."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<3",
]

[project.scripts]
train-model = "first_model.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


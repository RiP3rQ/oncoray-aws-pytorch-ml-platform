[project]
name = "core-api-service"
version = "0.1.0"
description = "FastAPI auth service for the monorepo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "asyncio>=4.0.0",
  "asyncpg>=0.30,<1",
  "bcrypt>=4.3,<5",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "fastapi-mail>=1.5,<2",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "jwt>=1.4.0",
  "passlib>=1.7,<2",
  "pydantic>=2.12.5",
  "PyJWT>=2.10,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.2,<2",
  "redis>=7.4.0",
  "rich>=14,<15",
  "sqlalchemy>=2.0,<3",
  "sqlmodel>=0.0.24,<0.1",
  "twilio>=9.8,<10",
  "uuid>=1.30",
  "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

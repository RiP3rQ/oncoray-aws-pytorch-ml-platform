[project]
name = "core-api-service"
version = "0.1.0"
description = "FastAPI auth service for the monorepo."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "bcrypt>=4.3,<5",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.2,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

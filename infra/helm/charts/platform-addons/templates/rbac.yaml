{{- if .Values.fluentBit.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "platform-addons.fullname" . }}-fluent-bit
  labels:
    {{- include "platform-addons.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "platform-addons.fullname" . }}-fluent-bit
  labels:
    {{- include "platform-addons.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "platform-addons.fullname" . }}-fluent-bit
subjects:
  - kind: ServiceAccount
    name: {{ .Values.fluentBit.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}

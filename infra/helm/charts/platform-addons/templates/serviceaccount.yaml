{{- if and .Values.fluentBit.enabled .Values.fluentBit.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.fluentBit.serviceAccount.name }}
  labels:
    {{- include "platform-addons.labels" . | nindent 4 }}
  {{- with .Values.fluentBit.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

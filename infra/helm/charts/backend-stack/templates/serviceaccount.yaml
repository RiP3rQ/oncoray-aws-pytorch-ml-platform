{{- $root := . -}}
{{- $workloads := deepCopy .Values.workloads -}}
{{- range $name, $workload := $workloads }}
{{- if and $workload.enabled $workload.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backend-stack.serviceAccountName" (dict "root" $root "component" $name "workload" $workload) }}
  labels:
    {{- include "backend-stack.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  {{- with $workload.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- end }}

{{- $root := . -}}
{{- $workloads := deepCopy .Values.workloads -}}
{{- range $name, $workload := $workloads }}
{{- if and $workload.enabled $workload.externalSecret.enabled $workload.externalSecret.data }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "backend-stack.componentName" (dict "root" $root "component" (printf "%s-secrets" $name)) }}
  labels:
    {{- include "backend-stack.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  refreshInterval: {{ $workload.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $workload.externalSecret.secretStoreRef.kind }}
    name: {{ $workload.externalSecret.secretStoreRef.name }}
  target:
    name: {{ $workload.externalSecret.targetName }}
    creationPolicy: Owner
  data:
    {{- range $item := $workload.externalSecret.data }}
    - secretKey: {{ $item.secretKey }}
      remoteRef:
        key: {{ $item.remoteRef.key }}
        {{- with $item.remoteRef.property }}
        property: {{ . }}
        {{- end }}
        {{- with $item.remoteRef.version }}
        version: {{ . }}
        {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}

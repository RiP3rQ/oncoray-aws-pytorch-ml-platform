{{- $root := . -}}
{{- $workloads := deepCopy .Values.workloads -}}
{{- range $slug, $runtime := .Values.modelRuntimes }}
{{- $name := default (printf "model-service-%s" $slug) $runtime.workloadName -}}
{{- $workload := include "backend-stack.modelRuntimeWorkload" (dict "root" $root "slug" $slug "runtime" $runtime) | fromYaml -}}
{{- $_ := set $workloads $name $workload -}}
{{- end }}
{{- range $name, $workload := $workloads }}
{{- if and $workload.enabled $workload.queueAutoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "backend-stack.componentName" (dict "root" $root "component" (printf "%s-trigger-auth" $name)) }}
  labels:
    {{- include "backend-stack.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  podIdentity:
    provider: aws
    identityOwner: workload
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "backend-stack.componentName" (dict "root" $root "component" (printf "%s-queue-scaler" $name)) }}
  labels:
    {{- include "backend-stack.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    name: {{ include "backend-stack.componentName" (dict "root" $root "component" $name) }}
  pollingInterval: {{ $workload.queueAutoscaling.pollingInterval }}
  cooldownPeriod: {{ $workload.queueAutoscaling.cooldownPeriod }}
  minReplicaCount: {{ $workload.queueAutoscaling.minReplicaCount }}
  maxReplicaCount: {{ $workload.queueAutoscaling.maxReplicaCount }}
  triggers:
    - type: aws-sqs-queue
      metadata:
        awsRegion: {{ default $root.Values.global.awsRegion $workload.queueAutoscaling.awsRegion | quote }}
        queueLength: {{ $workload.queueAutoscaling.queueLength | quote }}
        activationQueueLength: {{ $workload.queueAutoscaling.activationQueueLength | quote }}
        queueURLFromEnv: SQS_QUEUE_URL
      authenticationRef:
        name: {{ include "backend-stack.componentName" (dict "root" $root "component" (printf "%s-trigger-auth" $name)) }}
---
{{- end }}
{{- end }}
